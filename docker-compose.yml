services:
  # BACKEND
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autoflow_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - mongo_db

  # FRONTEND
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: autoflow_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # MONGO DB
  mongo_db:
    image: mongo:latest
    container_name: autoflow_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: